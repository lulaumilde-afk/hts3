name = "hts-online-multiplayer"
main = "worker.js"
compatibility_date = "2026-11-06"
workers_dev = true

[observability]
enabled = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Directory"]
